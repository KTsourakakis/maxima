pluginManagement {
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")
    def localPropertiesFile = file("local.properties")

    if (localPropertiesFile.exists()) {
        def properties = new Properties()
        localPropertiesFile.withInputStream { properties.load(it) }
        flutterSdkPath = properties.getProperty("flutter.sdk", flutterSdkPath)
    }

    if (!flutterSdkPath) {
        throw new GradleException(
            "Flutter SDK not configured. Set flutter.sdk in android/local.properties or set FLUTTER_ROOT."
        )
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
